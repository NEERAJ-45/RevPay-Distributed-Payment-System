name: CI/CD — Transaction Service

# ─────────────────────────────────────────────────────────────────────
#  Triggered ONLY when transaction-service/** or common/** changes on main.
#  Three strict sequential jobs:
#    1. test   → Maven + Testcontainers (real Postgres + Kafka)
#    2. docker → Build & push multi-stage image to GHCR
#    3. deploy → SSH to Oracle Cloud VM, blue/green-lite swap, health gate, rollback
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'transaction-service/**'
      - 'common/**'
  workflow_dispatch:

env:
  IMAGE:        ghcr.io/${{ github.repository_owner }}/revpay-transaction-service
  SERVICE_NAME: transaction-service
  SERVICE_PORT: 8083

jobs:

  # ══════════════════════════════════════════════════════════════════
  #  Job 1 — Test
  # ══════════════════════════════════════════════════════════════════
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit + integration tests (Testcontainers)
        run: |
          chmod +x mvnw
          ./mvnw clean verify \
            -pl common,transaction-service \
            -am \
            -B \
            --no-transfer-progress

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-transaction-service
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════
  #  Job 2 — Docker Build & Push (GHCR)
  # ══════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-stage image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: transaction-service/Dockerfile
          push: true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════
  #  Job 3 — Deploy to AWS EC2 VM (Health Gate + Auto-Rollback)
  # ══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to AWS EC2 VM
    runs-on: ubuntu-latest
    needs: docker                 # ← gates on docker push passing
    environment: production       # ← optional manual approval gate in GitHub UI

    steps:
      - name: Deploy, health-check, and auto-rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            IMAGE="${{ env.IMAGE }}"
            # Use the full 40-char SHA for unambiguous image pinning
            SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            NAME="${{ env.SERVICE_NAME }}"
            PORT="${{ env.SERVICE_PORT }}"

            echo "════════════════════════════════════════════════"
            echo "▶ Deploying $NAME → $IMAGE:$SHA_TAG to AWS EC2"
            echo "════════════════════════════════════════════════"

            # ── 1. Pull new image ──────────────────────────────────
            docker pull "$IMAGE:$SHA_TAG"

            # ── 2. Record current image for rollback ──────────────
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$NAME" 2>/dev/null || echo "")
            echo "  ↩ Previous image: ${PREVIOUS_IMAGE:-<none — first deploy>}"

            # ── 3. Gracefully stop and remove old container ───────
            docker stop "$NAME" 2>/dev/null || true
            docker rm   "$NAME" 2>/dev/null || true

            # ── 4. Start new container ────────────────────────────
            echo "▶ Starting $NAME on port $PORT"
            # Restricted resources for AWS Free Tier (1GB RAM t2.micro)
            docker run -d \
              --name "$NAME" \
              --network upi-net \
              --restart unless-stopped \
              -p "$PORT:$PORT" \
              -e JAVA_OPTS="-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -Xmx192m" \
              --memory="256m" \
              --env-file /opt/revpay/.env \
              "$IMAGE:$SHA_TAG"

            # ── 5. Health Check Gate (6 retries × 5 s = 30 s max) ─
            echo "▶ Waiting for /actuator/health to return UP..."
            RETRIES=6
            HEALTHY=false
            for i in $(seq 1 $RETRIES); do
              sleep 5
              STATUS=$(docker exec "$NAME" \
                wget -qO- "http://localhost:$PORT/actuator/health" 2>/dev/null \
                | grep -o '"status":"UP"' || echo "")
              if [ "$STATUS" = '"status":"UP"' ]; then
                echo "✅ $NAME is healthy (attempt $i/$RETRIES)"
                HEALTHY=true
                break
              fi
              echo "  ⏳ Attempt $i/$RETRIES — not healthy yet"
            done

            # ── 6. Auto-Rollback on failure ───────────────────────
            if [ "$HEALTHY" = "false" ]; then
              echo "❌ Health check FAILED — initiating rollback"
              docker stop "$NAME" 2>/dev/null || true
              docker rm   "$NAME" 2>/dev/null || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "↩ Rolling back to $PREVIOUS_IMAGE"
                docker run -d \
                  --name "$NAME" \
                  --network upi-net \
                  --restart unless-stopped \
                  -p "$PORT:$PORT" \
                  -e JAVA_OPTS="-XX:MaxRAMPercentage=50.0 -XX:+UseContainerSupport -Xmx192m" \
                  --memory="256m" \
                  --env-file /opt/revpay/.env \
                  "$PREVIOUS_IMAGE"
                echo "↩ Rollback complete — $NAME running previous image"
              else
                echo "⚠ No previous image found — $NAME remains stopped"
              fi
              exit 1   # ← marks this GitHub Actions step/job as FAILED (red ✗)
            fi

            # ── 7. Clean up old images (keep images < 72 h) ───────
            docker image prune -f --filter "until=72h" || true

            echo "════════════════════════════════════════════════"
            echo "✅ Deploy complete: $NAME → $IMAGE:$SHA_TAG"
            echo "════════════════════════════════════════════════"

